name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descompactar o projeto
        run: unzip -q FIUK_MODS_Projeto_Android.zip -d projeto

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        working-directory: projeto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Salvar o APK
        uses: actions/upload-artifact@v4
        with:
          name: FIUK-MODS-APK
          path: projeto/app/build/outputs/apk/debug/*.apk
